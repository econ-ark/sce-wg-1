name: Deploy MyST site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: /${{ github.event.repository.name }}/jedc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install MyST
        run: npm install -g mystmd
      - name: Build HTML
        run: |
          myst build --html
          cat site.css >> _build/html/myst-theme.css
          cp JEDC-special-issue-proposal.pdf JEDC-annex.pdf econ-ark-logo-white.png _build/html/
          python3 inject.py
        working-directory: jedc-prop
      - name: Assemble site under /jedc
        run: |
          mkdir -p site/jedc
          cp -r jedc-prop/_build/html/. site/jedc/
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=%s/">' "$BASE_URL" > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
