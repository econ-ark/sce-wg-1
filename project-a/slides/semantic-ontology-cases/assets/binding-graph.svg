<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 286" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ahr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c41230"/></marker>
    <marker id="ahc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0b7fae"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2f8f3d"/></marker>
  </defs>
  <!-- ===== left: the RHS tree with its binding structure drawn ===== -->
  <!-- tree edges -->
  <line x1="280" y1="40" x2="170" y2="74" stroke="#adb5bd" stroke-width="1.3"/>
  <line x1="280" y1="40" x2="390" y2="74" stroke="#adb5bd" stroke-width="1.3"/>
  <line x1="170" y1="106" x2="170" y2="140" stroke="#adb5bd" stroke-width="1.3"/>
  <line x1="390" y1="106" x2="390" y2="140" stroke="#adb5bd" stroke-width="1.3"/>
  <line x1="390" y1="172" x2="330" y2="206" stroke="#adb5bd" stroke-width="1.3"/>
  <line x1="390" y1="172" x2="390" y2="206" stroke="#adb5bd" stroke-width="1.3"/>
  <line x1="390" y1="172" x2="452" y2="206" stroke="#adb5bd" stroke-width="1.3"/>
  <!-- binding edges: dashed, colour-matched, NOT tree edges -->
  <path d="M 150,152 Q 60,84 234,28" fill="none" stroke="#c41230" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ahr)"/>
  <path d="M 408,224 Q 600,115 328,26" fill="none" stroke="#c41230" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ahr)"/>
  <path d="M 470,216 Q 515,150 424,100" fill="none" stroke="#0b7fae" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ahc)"/>
  <path d="M 322,238 Q 282,264 254,271" fill="none" stroke="#2f8f3d" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ahg)"/>
  <!-- nodes -->
  <rect x="236" y="8" width="88" height="32" rx="5" fill="#fff" stroke="#c41230" stroke-width="2"/>
  <text x="280" y="19" font-size="9" fill="#c41230" text-anchor="middle">binder</text>
  <text x="280" y="33" font-size="13" fill="#212529" text-anchor="middle">max<tspan dy="3" font-size="10">c</tspan><tspan dy="2" font-size="7.5">t</tspan></text>
  <rect x="135" y="74" width="70" height="32" rx="5" fill="#fff" stroke="#1f476b" stroke-width="1.8"/>
  <text x="170" y="85" font-size="9" fill="#676470" text-anchor="middle">apply</text>
  <text x="170" y="99" font-size="12.5" fill="#1f476b" text-anchor="middle">u(c<tspan dy="3" font-size="9">t</tspan><tspan dy="-3">)</tspan></text>
  <rect x="355" y="74" width="70" height="32" rx="5" fill="#fff" stroke="#00aeef" stroke-width="1.8"/>
  <text x="390" y="85" font-size="9" fill="#0b7fae" text-anchor="middle">binder</text>
  <text x="390" y="99" font-size="12.5" fill="#212529" text-anchor="middle">&#120124;<tspan dy="3" font-size="10">t</tspan></text>
  <rect x="148" y="140" width="44" height="30" rx="5" fill="#fff" stroke="#c41230" stroke-width="1.8"/>
  <text x="170" y="160" font-size="12.5" fill="#212529" text-anchor="middle">c<tspan dy="3" font-size="9">t</tspan><tspan dy="-3"></tspan></text>
  <rect x="315" y="140" width="150" height="32" rx="5" fill="#fff" stroke="#1f476b" stroke-width="1.8"/>
  <text x="390" y="151" font-size="9" fill="#676470" text-anchor="middle">apply</text>
  <text x="390" y="165" font-size="11" fill="#1f476b" text-anchor="middle">v<tspan dy="3" font-size="8">t+1</tspan><tspan dy="-3">(R(m</tspan><tspan dy="3" font-size="8">t</tspan><tspan dy="-3"> &#8722; c</tspan><tspan dy="3" font-size="8">t</tspan><tspan dy="-3">) + y</tspan><tspan dy="3" font-size="8">t+1</tspan><tspan dy="-3">)</tspan></text>
  <rect x="308" y="206" width="44" height="30" rx="5" fill="#fff" stroke="#39b54a" stroke-width="1.8"/>
  <text x="330" y="226" font-size="12.5" fill="#212529" text-anchor="middle">m<tspan dy="3" font-size="9">t</tspan><tspan dy="-3"></tspan></text>
  <rect x="370" y="206" width="40" height="30" rx="5" fill="#fff" stroke="#c41230" stroke-width="1.8"/>
  <text x="390" y="226" font-size="12.5" fill="#212529" text-anchor="middle">c<tspan dy="3" font-size="9">t</tspan><tspan dy="-3"></tspan></text>
  <rect x="426" y="206" width="52" height="30" rx="5" fill="#fff" stroke="#00aeef" stroke-width="1.8"/>
  <text x="452" y="226" font-size="12.5" fill="#212529" text-anchor="middle">y<tspan dy="3" font-size="9">t+1</tspan></text>
  <!-- Gamma badge for the free variable -->
  <rect x="223" y="262" width="52" height="26" rx="5" fill="#f6fbf6" stroke="#39b54a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="249" y="278" font-size="9.5" fill="#2f8f3d" text-anchor="middle">context</text>
  <text x="330" y="279" font-size="12.5" fill="#2f8f3d">m<tspan dy="3" font-size="9">t</tspan><tspan dy="-3"> is free, typed by the context</tspan></text>
  <text x="95" y="252" font-size="12.5" fill="#c41230" text-anchor="middle">binding edges,</text>
  <text x="95" y="266" font-size="12.5" fill="#c41230" text-anchor="middle">not tree edges</text>
</svg>
