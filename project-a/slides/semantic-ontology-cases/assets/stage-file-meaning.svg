<text x="549" y="136" font-size="11.5" fill="#495057" text-anchor="middle">(𝕋<tspan baseline-shift="sub" font-size="8">≻</tspan> <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="8">≻</tspan>)(<tspan font-style="italic">m</tspan>) = max<tspan baseline-shift="sub" font-size="8">0&lt;<tspan font-style="italic">c</tspan>≤<tspan font-style="italic">m</tspan></tspan> { <tspan font-style="italic">u</tspan>(<tspan font-style="italic">c</tspan>) + β <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="8">≻</tspan>(<tspan font-style="italic">m</tspan> − <tspan font-style="italic">c</tspan>) }</text>
<text x="243" y="136" font-size="11.5" fill="#495057" text-anchor="middle">(𝕋<tspan baseline-shift="sub" font-size="8">≺</tspan> <tspan font-style="italic">v</tspan>)(<tspan font-style="italic">k</tspan>) = ∫ <tspan font-style="italic">v</tspan>(<tspan font-style="italic">R k</tspan> + <tspan font-style="italic">y</tspan>) <tspan font-family="'STIX Two Math','Times New Roman',serif" font-style="italic">ν</tspan><tspan baseline-shift="sub" font-size="8" font-style="italic">y</tspan>(d<tspan font-style="italic">y</tspan>)</text>
<text x="10" y="160" font-size="11" font-weight="500" fill="#676470">Meaning, read forward on laws under a policy π</text>
