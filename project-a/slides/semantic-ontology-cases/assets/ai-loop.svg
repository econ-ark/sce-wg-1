<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="hb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#1f476b"/></marker>
    <marker id="hr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#c41230"/></marker>
    <marker id="hg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#39b54a"/></marker>
  </defs>
  <!-- boxes on one baseline -->
  <rect x="20" y="120" width="150" height="72" rx="6" fill="#ffffff" stroke="#2c4053" stroke-width="1.4"/>
  <text x="95" y="151" text-anchor="middle" font-size="20" fill="#212529">paper</text>
  <text x="95" y="176" text-anchor="middle" font-size="14" fill="#676470">prose and equations</text>
  <rect x="235" y="120" width="150" height="72" rx="6" fill="#1f476b" stroke="#1f476b" stroke-width="1.4"/>
  <text x="310" y="151" text-anchor="middle" font-size="20" fill="#ffffff">AI</text>
  <text x="310" y="176" text-anchor="middle" font-size="14" fill="#cfd8e2">writes the file</text>
  <rect x="450" y="120" width="180" height="72" rx="6" fill="#ffffff" stroke="#2c4053" stroke-width="1.4"/>
  <text x="540" y="151" text-anchor="middle" font-size="20" fill="#212529">written form</text>
  <text x="540" y="176" text-anchor="middle" font-size="14" fill="#676470">stage file, or a Lean file</text>
  <rect x="695" y="120" width="160" height="72" rx="6" fill="#ffffff" stroke="#2c4053" stroke-width="1.4"/>
  <text x="775" y="151" text-anchor="middle" font-size="20" fill="#212529">checker</text>
  <text x="775" y="176" text-anchor="middle" font-size="14" fill="#676470">elaborator, or the kernel</text>
  <rect x="920" y="120" width="160" height="72" rx="6" fill="#ffffff" stroke="#2c4053" stroke-width="1.4"/>
  <text x="1000" y="151" text-anchor="middle" font-size="20" fill="#212529">answer</text>
  <text x="1000" y="176" text-anchor="middle" font-size="14" fill="#676470">from Υ, Ρ or the proof</text>
  <!-- forward arrows -->
  <line x1="172" y1="156" x2="232" y2="156" stroke="#1f476b" stroke-width="1.8" marker-end="url(#hb)"/>
  <line x1="387" y1="156" x2="447" y2="156" stroke="#1f476b" stroke-width="1.8" marker-end="url(#hb)"/>
  <line x1="632" y1="156" x2="692" y2="156" stroke="#1f476b" stroke-width="1.8" marker-end="url(#hb)"/>
  <line x1="857" y1="156" x2="917" y2="156" stroke="#39b54a" stroke-width="1.8" marker-end="url(#hg)"/>
  <text x="887" y="112" text-anchor="middle" font-size="14" fill="#39b54a">accepted</text>
  <!-- refusal loop back to the AI, above the baseline -->
  <path d="M775,118 V70 a12,12 0 0 0 -12,-12 H322 a12,12 0 0 0 -12,12 V110" fill="none" stroke="#c41230" stroke-width="1.8" marker-end="url(#hr)"/>
  <text x="548" y="48" text-anchor="middle" font-size="16" fill="#c41230">refused, with the rule named: the AI's next prompt</text>
  <!-- what the checker does, below -->
  <text x="775" y="222" text-anchor="middle" font-size="14" fill="#676470">decides what the file means; the AI does not</text>
</svg>
