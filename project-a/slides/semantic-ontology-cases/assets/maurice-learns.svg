<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<marker id="hn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#1F476B"/></marker>
<marker id="hr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#c41230"/></marker>
<marker id="hg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#57545E"/></marker>
<marker id="hgn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#3a7d44"/></marker>
</defs>
<text x="20" y="30" font-size="15" font-weight="600" fill="#1F476B">Set-theoretic semantics</text>
<text x="20" y="52" font-size="14" fill="#57545E">each word is mapped to a subset of the domain D of individuals, and a name to one individual, with no relation stated between them</text>
<rect x="45" y="78" width="150" height="58" rx="4" fill="#ffffff" stroke="#E2E8EC" stroke-width="1.2"/>
<text x="120" y="101" text-anchor="middle" font-size="19" font-style="italic" fill="#20262E">ham</text>
<text x="120" y="126" text-anchor="middle" font-size="15" fill="#57545E">⟦ham⟧ ⊆ D</text>
<line x1="120" y1="140" x2="120" y2="241" stroke="#57545E" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#hg)"/>
<rect x="215" y="78" width="150" height="58" rx="4" fill="#ffffff" stroke="#E2E8EC" stroke-width="1.2"/>
<text x="290" y="101" text-anchor="middle" font-size="19" font-style="italic" fill="#20262E">bacon</text>
<text x="290" y="126" text-anchor="middle" font-size="15" fill="#57545E">⟦bacon⟧ ⊆ D</text>
<line x1="290" y1="140" x2="290" y2="241" stroke="#57545E" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#hg)"/>
<rect x="385" y="78" width="150" height="58" rx="4" fill="#ffffff" stroke="#E2E8EC" stroke-width="1.2"/>
<text x="460" y="101" text-anchor="middle" font-size="19" font-style="italic" fill="#20262E">sausages</text>
<text x="460" y="126" text-anchor="middle" font-size="15" fill="#57545E">⟦sausages⟧ ⊆ D</text>
<line x1="460" y1="140" x2="460" y2="241" stroke="#57545E" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#hg)"/>
<rect x="935" y="78" width="150" height="58" rx="4" fill="#ffffff" stroke="#E2E8EC" stroke-width="1.2"/>
<text x="1010" y="101" text-anchor="middle" font-size="19" font-style="italic" fill="#20262E">Maurice</text>
<text x="1010" y="126" text-anchor="middle" font-size="15" fill="#57545E">⟦Maurice⟧ ∈ D</text>
<line x1="1010" y1="140" x2="1010" y2="241" stroke="#57545E" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#hg)"/>
<text x="748" y="158" text-anchor="middle" font-size="14" fill="#57545E">real-world semantics: each word is mapped to its entity in the ontology</text>
<line x1="20" y1="182" x2="1080" y2="182" stroke="#20262E" stroke-width="1.6"/>
<text x="20" y="208" font-size="15" font-weight="600" fill="#1F476B">Ontology</text>
<text x="475" y="206" font-size="14" fill="#57545E">kinds in boxes, the individual in an oval,</text>
<text x="475" y="226" font-size="14" fill="#57545E">relations between kinds as blue or red arrows, instantiation as the green arrow</text>
<rect x="68.0" y="247.0" width="104" height="42" rx="3" fill="#F5F8FA" stroke="#1F476B" stroke-width="1.4"/>
<text x="120" y="274" text-anchor="middle" font-size="17" fill="#20262E">Ham</text>
<rect x="238.0" y="247.0" width="104" height="42" rx="3" fill="#F5F8FA" stroke="#1F476B" stroke-width="1.4"/>
<text x="290" y="274" text-anchor="middle" font-size="17" fill="#20262E">Bacon</text>
<rect x="408.0" y="247.0" width="104" height="42" rx="3" fill="#F5F8FA" stroke="#1F476B" stroke-width="1.4"/>
<text x="460" y="274" text-anchor="middle" font-size="17" fill="#20262E">Sausage</text>
<rect x="608.0" y="247.0" width="104" height="42" rx="3" fill="#F5F8FA" stroke="#1F476B" stroke-width="1.4"/>
<text x="660" y="274" text-anchor="middle" font-size="17" fill="#20262E">Pork</text>
<rect x="798.0" y="247.0" width="104" height="42" rx="3" fill="#F5F8FA" stroke="#1F476B" stroke-width="1.4"/>
<text x="850" y="274" text-anchor="middle" font-size="17" fill="#20262E">Pig</text>
<ellipse cx="1010" cy="268" rx="60" ry="21" fill="#ffffff" stroke="#1F476B" stroke-width="1.4"/>
<text x="1010" y="274" text-anchor="middle" font-size="17" font-style="italic" fill="#20262E">Maurice</text>
<path d="M 512,268 L 608,268" fill="none" stroke="#1F476B" stroke-width="1.8" marker-end="url(#hn)"/>
<text x="560" y="259" text-anchor="middle" font-size="12.5" fill="#1F476B">constitutedBy</text>
<path d="M 290,289.0 C 290,345 625,345 625,289.0" fill="none" stroke="#1F476B" stroke-width="1.8" marker-end="url(#hn)"/>
<text x="458" y="322" text-anchor="middle" font-size="12.5" fill="#1F476B">constitutedBy</text>
<path d="M 120,289.0 C 120,372 645,372 645,289.0" fill="none" stroke="#c41230" stroke-width="1.8" marker-end="url(#hr)"/>
<text x="382" y="366" text-anchor="middle" font-size="12.5" fill="#c41230">constitutedBy</text>
<path d="M 712,268 L 798,268" fill="none" stroke="#c41230" stroke-width="1.8" marker-end="url(#hr)"/>
<text x="755" y="259" text-anchor="middle" font-size="12.5" fill="#c41230">dependsOn</text>
<path d="M 950,268 L 902,268" fill="none" stroke="#3a7d44" stroke-width="1.8" marker-end="url(#hgn)"/>
<text x="926" y="304" text-anchor="middle" font-size="12.5" fill="#3a7d44">instantiation, Maurice : Pig</text>
<text x="1080" y="336" text-anchor="end" font-size="13" fill="#c41230">in red, the path between kinds from Ham to Pig</text>
<text x="1080" y="358" text-anchor="end" font-size="13" fill="#57545E">an arrow between kinds: every individual of the first is related to some individual of the second</text>
</svg>