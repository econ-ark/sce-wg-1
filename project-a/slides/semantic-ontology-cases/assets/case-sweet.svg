<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 236" width="1100" height="236" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="h" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#1f476b"/></marker></defs>
<rect x="20" y="28" width="410" height="180" rx="6" fill="#ffffff" stroke="#2c4053" stroke-width="1.4"/>
<text x="36" y="58" font-size="18" font-weight="500" fill="#1f476b">SWEET, Turtle source (sweetAll.ttl)</text>
<text x="36" y="90" font-size="14" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#212529">&lt;sweetAll&gt; a owl:Ontology ;</text>
<text x="36" y="118" font-size="14" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#212529">owl:versionInfo &quot;3.5.0&quot; ;</text>
<text x="36" y="146" font-size="14" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#212529">owl:imports 224 component ontologies</text>
<text x="36" y="174" font-size="14" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#212529">nine top-level concepts</text>
<rect x="670" y="28" width="410" height="180" rx="6" fill="#ffffff" stroke="#2c4053" stroke-width="1.4"/>
<text x="686" y="58" font-size="16.0" font-weight="500" fill="#1f476b">Kinds: about 11,000 classes in 225 ontologies</text>
<text x="686" y="90" font-size="15.5" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#212529">space, time, Earth realms, physical quantities</text>
<text x="686" y="118" font-size="15.5" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#212529">phenomena and events</text>
<text x="686" y="146" font-size="15.5" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#212529">aligned to QUDT and to SOSA/SSN</text>
<text x="686" y="174" font-size="15.5" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#212529">begun at NASA JPL, stewarded by ESIP</text>
<line x1="434" y1="118.0" x2="666" y2="118.0" stroke="#1f476b" stroke-width="1.8" marker-end="url(#h)"/>
<text x="550.0" y="84.0" text-anchor="middle" font-size="16" fill="#1f476b">OWL, read by any</text>
<text x="550.0" y="104.0" text-anchor="middle" font-size="16" fill="#1f476b">OWL-compliant tool</text>
<text x="550.0" y="142.0" text-anchor="middle" font-size="13.5" fill="#676470">changes reviewed by the</text>
<text x="550.0" y="160.0" text-anchor="middle" font-size="13.5" fill="#676470">subject-matter experts of ESIP&#x27;s</text>
<text x="550.0" y="178.0" text-anchor="middle" font-size="13.5" fill="#676470">committee</text>
</svg>