<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 236" width="1100" height="236" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="h" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#1f476b"/></marker></defs>
<rect x="20" y="28" width="410" height="180" rx="6" fill="#ffffff" stroke="#2c4053" stroke-width="1.4"/>
<text x="36" y="58" font-size="18" font-weight="500" fill="#1f476b">OWL 2 ontology, four axioms</text>
<text x="36" y="90" font-size="14" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#212529">SubClassOf( :Woman :Person )</text>
<text x="36" y="118" font-size="14" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#212529">ClassAssertion( :Woman :Mary )</text>
<text x="36" y="146" font-size="14" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#212529">ObjectPropertyRange( :hasWife :Woman )</text>
<text x="36" y="174" font-size="13.5" font-family="'JetBrains Mono', Menlo, Consolas, monospace" fill="#212529">ObjectMaxCardinality( 4 :hasChild :Parent )</text>
<rect x="670" y="28" width="410" height="180" rx="6" fill="#ffffff" stroke="#2c4053" stroke-width="1.4"/>
<text x="686" y="58" font-size="18" font-weight="500" fill="#1f476b">An interpretation of the axioms</text>
<text x="686" y="90" font-size="15.5" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#212529">Δ, a nonempty set, the object domain</text>
<text x="686" y="118" font-size="15.5" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#212529">a class C ↦ a subset Cᶜ ⊆ Δ</text>
<text x="686" y="146" font-size="15.5" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#212529">a property ↦ a relation ⊆ Δ × Δ</text>
<text x="686" y="174" font-size="15.5" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#212529">SubClassOf(C₁ C₂) holds iff C₁ᶜ ⊆ C₂ᶜ</text>
<line x1="434" y1="118.0" x2="666" y2="118.0" stroke="#1f476b" stroke-width="1.8" marker-end="url(#h)"/>
<text x="550.0" y="84.0" text-anchor="middle" font-size="16" fill="#1f476b">the Direct Semantics, W3C</text>
<text x="550.0" y="104.0" text-anchor="middle" font-size="16" fill="#1f476b">2012</text>
<text x="550.0" y="142.0" text-anchor="middle" font-size="13.5" fill="#676470">a reasoner, HermiT, ELK or Pellet,</text>
<text x="550.0" y="160.0" text-anchor="middle" font-size="13.5" fill="#676470">decides consistency and entailment</text>
</svg>