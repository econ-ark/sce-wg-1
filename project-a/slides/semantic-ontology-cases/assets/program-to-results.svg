<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 190" width="1100" height="190" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">From code to numerical results</title>
  <desc id="desc">A model file or program is processed under language rules and checks, then numerical methods produce results. The processing steps and checks differ across tools.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#1f476b"/></marker>
  </defs>
  <g fill="#f5f8fa" stroke="#1f476b" stroke-width="1.4">
    <rect x="1" y="15" width="188" height="120" rx="5"/>
    <rect x="235" y="15" width="295" height="120" rx="5"/>
    <rect x="575" y="15" width="260" height="120" rx="5"/>
    <rect x="880" y="15" width="219" height="120" rx="5"/>
  </g>
  <g stroke="#1f476b" stroke-width="1.8" marker-end="url(#arrow)">
    <line x1="194" y1="75" x2="226" y2="75"/>
    <line x1="535" y1="75" x2="566" y2="75"/>
    <line x1="840" y1="75" x2="871" y2="75"/>
  </g>
  <g text-anchor="middle" fill="#20262e" font-size="24" font-weight="500">
    <text x="95" y="62">Model file</text>
    <text x="95" y="93">or program</text>
    <text x="382.5" y="52">Language processing</text>
    <text x="705" y="52">Numerical methods</text>
    <text x="989.5" y="52">Results</text>
  </g>
  <g text-anchor="middle" fill="#57545e" font-size="20">
    <text x="382.5" y="85">Parse, check,</text>
    <text x="382.5" y="111">compile or interpret</text>
    <text x="705" y="85">Solve, simulate</text>
    <text x="705" y="111">or estimate</text>
    <text x="989.5" y="85">Policies, moments,</text>
    <text x="989.5" y="111">coefficients</text>
  </g>
  <text x="550" y="176" text-anchor="middle" fill="#676470" font-size="19">Conceptual schematic. Processing steps and checks differ across tools.</text>
</svg>
